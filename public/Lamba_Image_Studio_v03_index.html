let currentLang=localStorage.getItem('lamba_lang')||'ru';

function applyLanguage(){
  const t=translations[currentLang];
  document.documentElement.lang=currentLang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key=el.dataset.i18n;
    if(t[key]!==undefined) el.textContent=t[key];
  });
  document.querySelectorAll('.chip').forEach(b=>{
    b.textContent=t.styles[b.dataset.style]||b.textContent;
  });
  selectedStyleLabel.textContent=t.styles[selectedStyle]||selectedStyleLabel.textContent;
  prompt.value=stylePrompts[selectedStyle]?.[currentLang]||t.prompt;
  document.getElementById('langToggle').textContent=currentLang==='ru'?'RU / EN':'EN / RU';
  const saveImage=document.getElementById('saveImage');
  if(saveImage) saveImage.textContent=currentLang==='ru'?'💾 Сохранить фото':'💾 Save photo';
  if(!creditsBadge.hidden) setCredits(currentCredits);
}

function toggleLanguage(){
  currentLang=currentLang==='ru'?'en':'ru';
  localStorage.setItem('lamba_lang',currentLang);
  applyLanguage();
}

document.getElementById('langToggle').onclick=toggleLanguage;

const API_BASE=localStorage.getItem('lamba_api_url')||window.location.origin;
const creditsBadge=document.getElementById('creditsBadge');
let currentCredits=0;

function setCredits(value){
  currentCredits=Math.max(0,Number(value)||0);
  const t=translations[currentLang];
  const label=(t.credits||'💳 Credits: {n}').replace('{n}',currentCredits);
  creditsBadge.textContent=label;
  creditsBadge.hidden=false;
}

async function refreshCredits(){
  const {data:{session}}=await supabaseClient.auth.getSession();
  if(!session){
    creditsBadge.hidden=true;
    currentCredits=0;
    return 0;
  }
  const {data,error}=await supabaseClient
    .from('user_credits')
    .select('credits')
    .eq('user_id',session.user.id)
    .maybeSingle();
  if(error) throw error;
  const value=data?.credits ?? 0;
  setCredits(value);
  return value;
}

async function consumeCredit(){
  const {data,error}=await supabaseClient.rpc('consume_credit');
  if(error) throw error;
  const value=Array.isArray(data)?data[0]:data;
  setCredits(value);
  return Number(value);
}

async function refundCredit(){
  const {data,error}=await supabaseClient.rpc('refund_credit');
  if(error) throw error;
  const value=Array.isArray(data)?data[0]:data;
  setCredits(value);
  return Number(value);
}

const file=document.getElementById('file'),source=document.getElementById('source'),dropText=document.getElementById('dropText');
const status=document.getElementById('status'),prompt=document.getElementById('prompt'),preview=document.getElementById('preview'),gen=document.getElementById('generate');
const photoDrop=document.getElementById('photoDrop'),styleToggle=document.getElementById('styleToggle'),styles=document.getElementById('styles'),selectedStyleLabel=document.getElementById('selectedStyleLabel'),styleArrow=document.getElementById('styleArrow');
let selectedStyle='\u0441\u043f\u043e\u0440\u0442\u0438\u0432\u043d\u044b\u0439 \u043e\u0431\u0440\u0430\u0437';
applyLanguage();
refreshCredits().catch(()=>{});
file.onchange=()=>{const f=file.files?.[0];if(!f)return;if(!f.type.startsWith('image/')){status.textContent=translations[currentLang].invalidFile;return}if(source.src)URL.revokeObjectURL(source.src);source.src=URL.createObjectURL(f);source.hidden=false;dropText.hidden=true;photoDrop.classList.remove('zoomed');status.textContent=translations[currentLang].loaded};
photoDrop.addEventListener('click',e=>{if(e.target===source)return;file.click()});
photoDrop.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();file.click()}});
styleToggle.onclick=()=>{const open=!styles.hidden;styles.hidden=open;styleArrow.textContent=open?'\u25be':'\u25b4'};
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');selectedStyle=b.dataset.style;selectedStyleLabel.textContent=b.textContent;prompt.value=stylePrompts[selectedStyle]?.[currentLang]||translations[currentLang].prompt;styles.hidden=true;styleArrow.textContent='\u25be'});
source.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();photoDrop.classList.toggle('zoomed')});
document.getElementById('clear').onclick=()=>{const saveImage=document.getElementById('saveImage');if(saveImage)saveImage.remove();file.value='';if(source.src)URL.revokeObjectURL(source.src);source.removeAttribute('src');source.hidden=true;dropText.hidden=false;photoDrop.classList.remove('zoomed');status.textContent='';if(preview.dataset.objectUrl)URL.revokeObjectURL(preview.dataset.objectUrl);delete preview.dataset.objectUrl;preview.innerHTML='<div class="empty"><div class="icon">\ud83d\uddbc\ufe0f</div><div data-i18n="emptyResult">'+translations[currentLang].emptyResult+'</div></div>'};
document.getElementById('registerBtn').onclick=async()=>{
  const email=document.getElementById('authEmail').value.trim();
  const password=document.getElementById('authPassword').value;
  const authStatus=document.getElementById('authStatus');

  if(!email || !password){
    authStatus.textContent='Введите email и пароль';
    return;
  }

  const {error}=await supabaseClient.auth.signUp({email,password});

  if(error){
    authStatus.textContent='Ошибка: '+error.message;
    return;
  }

  authStatus.textContent='Регистрация выполнена. Теперь войдите.';
  await refreshCredits();
};

document.getElementById('loginBtn').onclick=async()=>{
  const email=document.getElementById('authEmail').value.trim();
  const password=document.getElementById('authPassword').value;
  const authStatus=document.getElementById('authStatus');

  if(!email || !password){
    authStatus.textContent='Введите email и пароль';
    return;
  }

  const {error}=await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  if(error){
    authStatus.textContent='Ошибка входа: '+error.message;
    return;
  }

  authStatus.textContent='Вы вошли в Lamba Image Studio ✅';
  await refreshCredits();
};
gen.onclick=async()=>{
  // Получаем актуальную сессию напрямую из Supabase перед каждой генерацией.
  // Это исправляет ситуацию, когда пользователь уже вошёл, но клиент держит
  // устаревшее состояние сессии.
  let session=null;
  try{
    const {data,error}=await supabaseClient.auth.getSession();
    if(error) throw error;
    session=data?.session||null;

    // Если getSession() ещё не видит сессию, даём Supabase короткое время
    // восстановить её из storage и проверяем ещё раз.
    if(!session){
      await new Promise(resolve=>setTimeout(resolve,300));
      const retry=await supabaseClient.auth.getSession();
      session=retry?.data?.session||null;
    }
  }catch(e){
    status.textContent='❌ '+e.message;
    return;
  }

  if(!session){
    status.textContent=currentLang==='ru'
      ? '🔒 Сначала зарегистрируйтесь или войдите в аккаунт.'
      : '🔒 Please register or log in first.';
    document.getElementById('authEmail').focus();
    return;
  }

  if(!file.files?.[0]){
    status.textContent=translations[currentLang].chooseFirst;
    return;
  }

  let balance;
  try{
    balance=await refreshCredits();
  }catch(e){
    status.textContent='❌ '+e.message;
    return;
  }

  if(balance<=0){
    status.textContent=translations[currentLang].buyCredits;

    let buyBtn=document.getElementById('buyCreditsBtn');

    if(!buyBtn){
      buyBtn=document.createElement('button');
      buyBtn.id='buyCreditsBtn';
      buyBtn.className='primary';
      buyBtn.style.marginTop='10px';
      buyBtn.textContent=currentLang==='ru'
        ? '💳 Купить 10 генераций — $2.99'
        : '💳 Buy 10 generations — $2.99';

      buyBtn.onclick=async()=>{
        buyBtn.disabled=true;
        buyBtn.textContent=currentLang==='ru'
          ? '⏳ Переход к оплате…'
          : '⏳ Opening payment…';

        try{
          const {data:{session}}=await supabaseClient.auth.getSession();

          if(!session){
            throw new Error(
              currentLang==='ru'
                ? 'Сначала войдите в аккаунт.'
                : 'Please log in first.'
            );
          }

          const response=await fetch(
            API_BASE.replace(/\/$/,'')+'/api/payment/create',
            {
              method:'POST',
              headers:{
                'Content-Type':'application/json',
                'Authorization':'Bearer '+session.access_token
              },
              body:JSON.stringify({
                package:'10_generations',
                amount:299
              })
            }
          );

          const data=await response.json().catch(()=>({}));

          if(!response.ok){
            throw new Error(data.error||'Payment error');
          }

          const paymentUrl=typeof data.url==='string' ? data.url.trim() : '';

          if(!paymentUrl){
            throw new Error('Payment URL was not returned by the server.');
          }

          let safePaymentUrl;
          try{
            safePaymentUrl=new URL(paymentUrl, window.location.origin);
          }catch(_){
            throw new Error('The server returned an invalid payment URL.');
          }

          if(!['http:','https:'].includes(safePaymentUrl.protocol)){
            throw new Error('The server returned an unsupported payment URL.');
          }

          window.location.assign(safePaymentUrl.href);

        }catch(e){
          status.textContent='❌ '+e.message;
          buyBtn.disabled=false;
          buyBtn.textContent=currentLang==='ru'
            ? '💳 Купить 10 генераций — $2.99'
            : '💳 Buy 10 generations — $2.99';
        }
      };

      gen.parentElement.appendChild(buyBtn);
    }

    return;
  }

  if(!API_BASE){
    status.textContent=translations[currentLang].noApi;
    return;
  }

  gen.disabled=true;
  status.textContent=translations[currentLang].sending;

  try{
    const fd=new FormData();
    fd.append('image',file.files[0]);
    fd.append('style',selectedStyle);
    fd.append('prompt',prompt.value);
    // Надёжно получаем email именно из авторизованного пользователя Supabase.
    // getUser() запрашивает актуального пользователя, поэтому не зависим
    // от того, что лежит/не лежит в локальном поле Email на странице.
    let userEmail='';
    try{
      const {data:userData,error:userError}=await supabaseClient.auth.getUser();
      if(userError) throw userError;
      userEmail=String(userData?.user?.email||'').trim().toLowerCase();
    }catch(_){
      // Резерв: email из текущей сессии или из поля авторизации.
      userEmail=String(session?.user?.email||'').trim().toLowerCase()
        || String(document.getElementById('authEmail')?.value||'').trim().toLowerCase();
    }

    if(!userEmail){
      throw new Error(
        currentLang==='ru'
          ? 'Не удалось получить email авторизованного пользователя. Выйдите и войдите снова.'
          : 'Could not get the email of the logged-in user. Please log in again.'
      );
    }

    fd.append('email',userEmail);

    const r=await fetch(API_BASE.replace(/\/$/,'')+'/api/generate',{
      method:'POST',
      headers:{
        'Authorization':'Bearer '+session.access_token
      },
      body:fd
    });
    if(!r.ok){
      const data=await r.json().catch(()=>({}));
      throw new Error(data.error||('HTTP '+r.status));
    }

    const blob=await r.blob();
    if(!blob.size) throw new Error('Сервер не вернул изображение.');

    if(preview.dataset.objectUrl) URL.revokeObjectURL(preview.dataset.objectUrl);
    const url=URL.createObjectURL(blob);
    preview.dataset.objectUrl=url;
    preview.innerHTML='<img alt="Сгенерированный результат" src="'+url+'">';

    let saveBtn=document.getElementById('saveImage');
    if(saveBtn) saveBtn.remove();
    saveBtn=document.createElement('button');
    saveBtn.id='saveImage';
    saveBtn.className='secondary';
    saveBtn.style.marginTop='10px';
    saveBtn.textContent=currentLang==='ru'?'💾 Сохранить фото':'💾 Save photo';
    saveBtn.onclick=()=>{
      const a=document.createElement('a');
      a.href=url;
      a.download='lamba-image.png';
      a.target='_blank';
      document.body.appendChild(a);
      a.click();
      a.remove();
    };
    preview.parentElement.appendChild(saveBtn);

    await refreshCredits();
    status.textContent=translations[currentLang].done;
  }catch(e){
    status.textContent='❌ '+e.message;
  }finally{
    gen.disabled=false;
  }
};

</script>
</body></html>
