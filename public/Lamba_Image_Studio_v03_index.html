let currentLang=localStorage.getItem('lamba_lang')||'ru';

function applyLanguage(){
  const t=translations[currentLang];
  document.documentElement.lang=currentLang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key=el.dataset.i18n;
    if(t[key]!==undefined) el.textContent=t[key];
  });
  document.querySelectorAll('.chip').forEach(b=>{
    b.textContent=t.styles[b.dataset.style]||b.textContent;
  });
  selectedStyleLabel.textContent=t.styles[selectedStyle]||selectedStyleLabel.textContent;
  prompt.value=stylePrompts[selectedStyle]?.[currentLang]||t.prompt;
  document.getElementById('langToggle').textContent=currentLang==='ru'?'RU / EN':'EN / RU';
}

function toggleLanguage(){
  currentLang=currentLang==='ru'?'en':'ru';
  localStorage.setItem('lamba_lang',currentLang);
  applyLanguage();
}

document.getElementById('langToggle').onclick=toggleLanguage;

  preview.innerHTML='<img alt="\u0421\u0433\u0435\u043d\u0435\u0440\u0438\u0440\u043e\u0432\u0430\u043d\u043d\u044b\u0439 \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442" src="data:image/png;base64,'+data.image+'">';
  status.textContent=translations[currentLang].done;
 }catch(e){status.textContent='\u274c '+e.message}
 finally{gen.disabled=false}
};
videoBtn.onclick=async()=>{
 if(!file.files?.[0]){status.textContent=translations[currentLang].chooseFirst;return}
 if(!API_BASE){status.textContent=translations[currentLang].noApi;return}
 videoBtn.disabled=true;gen.disabled=true;status.textContent=translations[currentLang].creatingVideo;
 const fd=new FormData();fd.append('image',file.files[0]);fd.append('prompt','\u041a\u0430\u043c\u0435\u0440\u0430 \u043f\u043b\u0430\u0432\u043d\u043e \u043f\u0440\u0438\u0431\u043b\u0438\u0436\u0430\u0435\u0442\u0441\u044f, \u0447\u0435\u043b\u043e\u0432\u0435\u043a \u0441\u043b\u0435\u0433\u043a\u0430 \u0434\u0432\u0438\u0433\u0430\u0435\u0442\u0441\u044f \u0435\u0441\u0442\u0435\u0441\u0442\u0432\u0435\u043d\u043d\u043e. \u0421\u043e\u0445\u0440\u0430\u043d\u0438\u0442\u044c \u043b\u0438\u0446\u043e, \u043e\u0434\u0435\u0436\u0434\u0443 \u0438 \u0444\u043e\u043d.');
 try{
  const r=await fetch(API_BASE.replace(/\/$/,'')+'/api/video',{method:'POST',body:fd});
  if(!r.ok){const data=await r.json().catch(()=>({}));throw new Error(data.error||('HTTP '+r.status));}
  const blob=await r.blob();
  const url=URL.createObjectURL(blob);
  preview.innerHTML='<video controls playsinline autoplay loop style="max-width:100%;max-height:680px;display:block"><source src="'+url+'" type="video/mp4"></video>';
  status.textContent=translations[currentLang].videoDone;
 }catch(e){status.textContent='\u274c '+e.message}
 finally{videoBtn.disabled=false;gen.disabled=false}
};
</script>
</body></html>
