<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lamba Image Studio</title>
<style>
:root{--bg:#0b0d12;--card:#151923;--text:#f5f7fb;--muted:#9aa3b2;--accent:#8b5cf6;--border:#2a3040}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#202638,#0b0d12 48%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:1050px;margin:auto;padding:22px 16px 40px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.logo{font-size:24px;font-weight:800}.logo span{color:#a78bfa}.badge{font-size:12px;color:#c4b5fd;background:#251b3e;border:1px solid #49337a;padding:7px 10px;border-radius:999px}
.grid{display:grid;grid-template-columns:390px 1fr;gap:16px}@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:#151923eb;border:1px solid var(--border);border-radius:20px;padding:16px;box-shadow:0 12px 40px #0005}h2{font-size:16px;margin:0 0 12px}
.drop{height:210px;border:1px dashed #4a5365;border-radius:16px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);overflow:hidden;background:#10141c;cursor:pointer}.drop img{width:100%;height:100%;object-fit:cover}.drop strong{color:#fff;display:block;margin-bottom:6px}
input[type=file]{display:none}.styles{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px}.chip{border:1px solid var(--border);background:#11151e;color:#d7dce6;padding:9px 11px;border-radius:12px;cursor:pointer}.chip.active{background:#34205d;border-color:#8b5cf6;color:#fff}
textarea{width:100%;min-height:105px;resize:vertical;background:#10141c;color:#fff;border:1px solid var(--border);border-radius:14px;padding:12px;font:inherit;outline:none}textarea:focus{border-color:#8b5cf6}
.row{display:flex;gap:10px;margin-top:10px}.row>*{flex:1}button{width:100%;border:0;border-radius:14px;padding:13px 16px;font-weight:750;font-size:15px;cursor:pointer}.primary{background:linear-gradient(135deg,#8b5cf6,#6366f1);color:#fff}.secondary{background:#242a37;color:#e8ebf1}.primary:disabled{opacity:.55;cursor:wait}
.preview{min-height:520px;display:flex;align-items:center;justify-content:center;background:#0f131b;border-radius:16px;border:1px solid var(--border);overflow:hidden}.preview img{max-width:100%;max-height:680px;display:block}.empty{text-align:center;color:var(--muted);padding:30px}.empty .icon{font-size:48px;margin-bottom:10px}.status{margin-top:10px;font-size:13px;color:#b7c0cf;min-height:20px}.note{font-size:12px;color:#8f98a8;line-height:1.45;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
<div class="head"><div class="logo">Lamba <span>Image Studio</span></div><div class="badge">v0.3 iPad Ready</div></div>
<div class="grid">
<section class="card">
<h2>1. Исходное фото</h2>
<label class="drop" for="file"><div id="dropText"><strong>Нажми, чтобы выбрать фото</strong>PNG / JPG / WEBP</div><img id="source" hidden></label>
<input id="file" type="file" accept="image/png,image/jpeg,image/webp">
<h2 style="margin-top:16px">2. Образ</h2>
<div class="styles">
<button class="chip active" data-style="спортивный образ">Спортивный</button>
<button class="chip" data-style="вечерний наряд">Вечерний</button>
<button class="chip" data-style="деловой стиль">Деловой</button>
<button class="chip" data-style="повседневный стиль">Casual</button>
<button class="chip" data-style="зимний образ">Зимний</button>
</div>
<h2>3. Что изменить</h2>
<textarea id="prompt">Изменить только одежду, сохранив человека, лицо, позу и фон. Сделать образ современным и красивым.</textarea>
<div class="row"><button class="secondary" id="clear">Очистить</button><button class="primary" id="generate">✨ Сгенерировать</button></div>
<div class="status" id="status"></div>
<div class="note">Сервер настраивается отдельно. Ключ AI не хранится в HTML.</div>
</section>
<section class="card"><h2>Результат</h2><div class="preview" id="preview"><div class="empty"><div class="icon">🖼️</div><div>Здесь появится сгенерированное изображение</div></div></div></section>
</div></div>
<script>
const API_BASE='';
const file=document.getElementById('file'),source=document.getElementById('source'),dropText=document.getElementById('dropText');
const status=document.getElementById('status'),prompt=document.getElementById('prompt'),preview=document.getElementById('preview'),gen=document.getElementById('generate');
let selectedStyle='спортивный образ';
file.hidden=false;dropText.hidden=true;status.textContent='Фото выбрано.';};if(!f)return;source.src=URL.createObjectURL(f);source.hidden=false;dropText.hidden=true;status.textContent='Фото загружено.'};
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');selectedStyle=b.dataset.style});
document.getElementById('clear').onclick=()=>{file.value='';source.hidden=true;dropText.hidden=false;status.textContent='';preview.innerHTML='<div class="empty"><div class="icon">🖼️</div><div>Здесь появится сгенерированное изображение</div></div>'};
gen.onclick=async()=>{
 if(!file.files?.[0]){status.textContent='Сначала выбери исходное фото.';return}
 if(
 gen.disabled=true;status.textContent='⏳ Отправляю фото на AI…';
 const fd=new FormData();fd.append('image',file.files[0]);fd.append('style',selectedStyle);fd.append('prompt',prompt.value);
 try{
  conconst r=await fetch('/api/generate',{method:'POST',body:fd});
  const data=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(data.error||('HTTP '+r.status));
  if(!data.image)throw new Error('Сервер не вернул изображение.');
  preview.innerHTML='<img alt="Сгенерированный результат" src="data:image/png;base64,'+data.image+'">';
  status.textContent='✨ Готово!';
 }catch(e){status.textContent='❌ '+e.message}
 finally{gen.disabled=false}
};
</script>
</body></html>
