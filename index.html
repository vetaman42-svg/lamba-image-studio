<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lamba Image Studio</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#111;color:#fff;margin:0;padding:24px}main{max-width:700px;margin:auto}h1{margin-top:0}.box{background:#1b1b1b;border-radius:18px;padding:18px;margin:14px 0}input,textarea,button{width:100%;box-sizing:border-box;font:inherit;border-radius:12px;padding:13px;margin-top:10px}textarea{min-height:90px}button{background:#fff;color:#111;border:0;font-weight:700}button:disabled{opacity:.5}img{max-width:100%;border-radius:14px;margin-top:12px}.status{white-space:pre-wrap;color:#bbb}.previewWrap{margin-top:14px}.previewTitle{color:#bbb;font-size:14px;margin-bottom:8px}#preview{display:block;width:100%;max-height:520px;object-fit:contain;background:#000;margin-top:0;border-radius:14px}</style></head>
<body><main><h1>Lamba Image Studio</h1><div class="box"><label>1. Выбери фото</label><input id="image" type="file" accept="image/jpeg,image/png,image/webp"><div id="previewWrap" class="previewWrap" hidden><div class="previewTitle">Выбранное фото</div><img id="preview" alt="Предпросмотр выбранного фото"></div></div><div class="box"><label>2. Что изменить</label><textarea id="prompt" placeholder="Например: измени цвет платья на красный, лицо и волосы оставь без изменений"></textarea><button id="go">Сгенерировать</button><div id="status" class="status"></div></div><div class="box"><b>Результат</b><div id="result"></div></div></main>
<script>const image=document.querySelector('#image'),preview=document.querySelector('#preview'),previewWrap=document.querySelector('#previewWrap'),prompt=document.querySelector('#prompt'),go=document.querySelector('#go'),status=document.querySelector('#status'),result=document.querySelector('#result');let previewUrl='';image.addEventListener('change',()=>{const file=image.files[0];if(previewUrl)URL.revokeObjectURL(previewUrl);if(!file){previewWrap.hidden=true;preview.removeAttribute('src');return}previewUrl=URL.createObjectURL(file);preview.src=previewUrl;previewWrap.hidden=false;status.textContent='Фото выбрано.'});go.onclick=async()=>{if(!image.files[0])return status.textContent='Сначала выбери фото.';if(!prompt.value.trim())return status.textContent='Напиши, что изменить.';go.disabled=true;status.textContent='Генерирую…';result.innerHTML='';try{const f=new FormData();f.append('image',image.files[0]);f.append('prompt',prompt.value.trim());const r=await fetch('/api/generate',{method:'POST',body:f});if(!r.ok){let e={};try{e=await r.json()}catch{}throw new Error(e.error||`Ошибка сервера: ${r.status}`)}const blob=await r.blob();const url=URL.createObjectURL(blob);result.innerHTML=`<img src="${url}" alt="Результат">`;status.textContent='Готово.'}catch(e){status.textContent=e.message}finally{go.disabled=false}};</script></body></html>
